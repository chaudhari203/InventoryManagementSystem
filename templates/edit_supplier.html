{% extends "base.html" %}

{% block title %}
Edit Supplier
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h2 class="fw-bold mb-1">
            Edit Supplier
        </h2>

        <p class="text-muted mb-0">
            Update supplier information
        </p>
    </div>

    <a
        href="{{ url_for('suppliers') }}"
        class="btn btn-outline-secondary"
    >
        <i class="bi bi-arrow-left me-1"></i>
        Back
    </a>

</div>


<div class="card border-0 shadow-sm">

    <div class="card-body">

        <form
            method="POST"
            action="{{ url_for('edit_supplier', id=supplier.id) }}"
        >

            <!-- Supplier Name -->

            <div class="mb-3">

                <label
                    for="name"
                    class="form-label fw-semibold"
                >
                    Supplier Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    value="{{ supplier.name }}"
                    required
                >

            </div>


            <!-- Phone -->

            <div class="mb-3">

                <label
                    for="phone"
                    class="form-label fw-semibold"
                >
                    Phone
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="phone"
                    name="phone"
                    value="{{ supplier.phone or '' }}"
                >

            </div>


            <!-- Email -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label fw-semibold"
                >
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    value="{{ supplier.email or '' }}"
                >

            </div>


            <!-- Buttons -->

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    <i class="bi bi-check-lg me-1"></i>
                    Update Supplier
                </button>

                <a
                    href="{{ url_for('suppliers') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
