{% extends "base.html" %}

{% block title %}
Add Product
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card border-0 shadow-sm">

            <div class="card-header bg-white py-3">

                <h4 class="fw-bold mb-0">
                    <i class="bi bi-box-seam me-2"></i>
                    Add Product
                </h4>

            </div>

            <div class="card-body">

                <form
                    method="POST"
                    action="{{ url_for('add_product') }}"
                >

                    <div class="row g-3">

                        <!-- Product Name -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Product Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- SKU -->

                        <div class="col-md-6">

                            <label class="form-label">
                                SKU
                            </label>

                            <input
                                type="text"
                                name="sku"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- Price -->

                        <div class="col-md-4">

                            <label class="form-label">
                                Price
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    ₹
                                </span>

                                <input
                                    type="number"
                                    name="price"
                                    class="form-control"
                                    step="0.01"
                                    min="0"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Quantity -->

                        <div class="col-md-4">

                            <label class="form-label">
                                Quantity
                            </label>

                            <input
                                type="number"
                                name="quantity"
                                class="form-control"
                                min="0"
                                required
                            >

                        </div>


                        <!-- Low Stock -->

                        <div class="col-md-4">

                            <label class="form-label">
                                Low Stock Alert
                            </label>

                            <input
                                type="number"
                                name="low_stock_threshold"
                                class="form-control"
                                value="5"
                                min="0"
                                required
                            >

                        </div>


                        <!-- Category -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                name="category_id"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Category
                                </option>

                                {% for category in categories %}

                                <option
                                    value="{{ category.id }}"
                                >
                                    {{ category.name }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Supplier -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Supplier
                            </label>

                            <select
                                name="supplier_id"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Supplier
                                </option>

                                {% for supplier in suppliers %}

                                <option
                                    value="{{ supplier.id }}"
                                >
                                    {{ supplier.name }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>

                    </div>


                    <!-- Buttons -->

                    <div class="mt-4 d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >

                            <i class="bi bi-check-lg me-1"></i>

                            Save Product

                        </button>

                        <a
                            href="{{ url_for('products') }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
