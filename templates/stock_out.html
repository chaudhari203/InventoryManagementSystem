{% extends "base.html" %}

{% block content %}

<h3>Stock Out - {{ product.name }}</h3>

<p>
Current Stock:
<strong>{{ product.quantity }}</strong>
</p>

<form method="POST">

    <label>Quantity</label>

    <input
        type="number"
        name="quantity"
        class="form-control"
        min="1"
        required
    >

    <button
        class="btn btn-warning mt-3"
    >
        Remove Stock
    </button>

</form>

{% endblock %}
